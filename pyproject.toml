[tool.poetry]
name = "analysis-of-bank-transactions"
version = "0.1.0"
description = "Приложение для анализа банковских транзакций"
authors = ["Davlyatshina Victoria <vika.davlyatshina@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
requests = "^2.31.0"
pandas-stubs = "^2.3.2.250926"  # типы для pandas
python-dotenv = "^1.2.1"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.0"
black = "^25.11.0"
isort = "^7.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"

[tool.black]
line-length = 119

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
python_version = "3.13"
show_error_codes = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

exclude = '''
    ^(\.venv|venv|env|\.env)/
    ^(\.mypy_cache|__pycache__)/
    ^(build|dist)/
    ^\.git/
    ^tests/
'''

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*"]
ignore_missing_imports = true
